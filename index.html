<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAlpha Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Image Gallery</h1>
        <p>Explore the beauty of the world</p>
    </header>

    <div class="filters">
        <button class="active" data-filter="all">All</button>
        <button data-filter="nature">Nature</button>
        <button data-filter="city">City</button>
        <button data-filter="ocean">Ocean</button>
    </div>

    <div class="gallery">
        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80" alt="Mountain lake">
        </div>

        <div class="gallery-item" data-category="ocean">
            <img src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=800&q=80" alt="Ocean waves">
        </div>

        <div class="gallery-item" data-category="city">
            <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=800&q=80" alt="City skyline">
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=800&q=80" alt="Green forest">
        </div>

        <div class="gallery-item" data-category="city">
            <img src="https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?auto=format&fit=crop&w=800&q=80" alt="City buildings">
        </div>

        <div class="gallery-item" data-category="ocean">
            <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=800&q=80" alt="Blue sea">
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80" alt="Mountain peaks">
        </div>

        <div class="gallery-item" data-category="city">
            <img src="https://images.unsplash.com/photo-1519671482749-fd09be7ccebf?auto=format&fit=crop&w=800&q=80" alt="Beautiful architecture">
        </div>
    </div>

    <div class="lightbox" id="lightbox">
        <button id="close" class="close" aria-label="Close">&times;</button>
        <button id="prev" class="nav prev" aria-label="Previous image">&#10094;</button>
        <img id="lightbox-img" src="" alt="Selected photograph">
        <button id="next" class="nav next" aria-label="Next image">&#10095;</button>
        <p id="image-counter"></p>
    </div>

    <footer>
        <p>Created for CodeAlpha Frontend Development Internship</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
